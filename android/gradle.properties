# Machine is shared by up to 8 agent sessions (18 cores): cap Gradle's worker fan-out.
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process so no KotlinCompileDaemon outlives a build.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
